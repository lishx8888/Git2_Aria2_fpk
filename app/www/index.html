<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aria2 下载中心</title>
<link rel="icon" href="favicon.png">
<style>
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --line:#e5e9f2;
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#4f6ef7;
  --accent2:#7c5cf0;
  --ok:#10b981;
  --warn:#f59e0b;
  --err:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.topbar{
  flex:none;display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#4f6ef7,#7c5cf0);
  color:#fff;padding:14px 20px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
  padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap;
}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;flex:none}
.dot.on{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.35)}
.dot.off{background:#f87171}
.card{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:var(--card);border:none;border-radius:0;
  padding:16px 20px;width:100%;min-height:0;
}
.card + .card{margin-top:18px}
.muted{color:var(--muted);font-size:13px}
input:focus{outline:none;border-color:var(--accent);background:#fff}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#4f6ef7,#7c5cf0);color:#fff;border:none;
  padding:11px 20px;border-radius:10px;font-size:15px;font-weight:600;
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,110,247,.35)}
.btn:active{transform:none}
.btn.ghost{background:#eef1f8;color:var(--text)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px;transition:none}
.btn.small:hover{transform:none;box-shadow:none;filter:brightness(.95)}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.warn{background:#fef3c7;color:#b45309}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.top{margin-bottom:16px}
input[type=text]{flex:1;width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;font-size:16px;background:#fafbfe}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
.msg{padding:10px 14px;border-radius:10px;margin-top:10px;font-size:14px}
.msg.ok{background:#ecfdf5;color:#047857}
.msg.err{background:#fef2f2;color:#b91c1c}
.msg.info{background:#eff6ff;color:#1d4ed8}
.table-wrap{flex:1;overflow-y:auto;overflow-x:auto;min-height:0;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.name{overflow-wrap:break-word;word-break:break-word}
col.col-name{width:auto}
col.col-size{width:72px}
col.col-progress{width:84px}
col.col-speed{width:72px}
col.col-status{width:56px}
col.col-ops{width:104px}
th:not(:first-child),td:not(:first-child){text-align:center}
.ring{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.ring svg{width:36px;height:36px;transform:rotate(-90deg)}
.ring .ring-bg{fill:none;stroke:#eef1f8;stroke-width:4}
.ring .ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .3s}
.ring .ring-pct{font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.tag.active{background:#dbeafe;color:#1d4ed8}
.tag.waiting{background:#fef3c7;color:#b45309}
.tag.paused{background:#f3f4f6;color:#4b5563}
.tag.complete{background:#d1fae5;color:#047857}
.tag.error{background:#fee2e2;color:#b91c1c}
.tag.removed{background:#f3f4f6;color:#9ca3af}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.empty{padding:34px;text-align:center;color:var(--muted)}
.overlay{
  display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);
  align-items:center;justify-content:center;z-index:100;padding:20px;
}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin-bottom:18px}
.modal .btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:0 0 24px}
@media(max-width:640px){
  .topbar{padding:10px 12px;gap:6px}
  .pill{padding:4px 8px;font-size:11px;gap:4px}
  .dot{width:7px;height:7px}
  .btn.small{padding:5px 10px;font-size:12px;border-radius:8px}
  .card{padding:12px}
  th,td{padding:5px 3px;font-size:12px}
  td.name{word-break:break-word}
  col.col-size{width:40px}
  col.col-progress{width:52px}
  col.col-speed{width:40px}
  col.col-status{width:36px}
  col.col-ops{width:64px}
  .ring svg{width:28px;height:28px}
  .ring{gap:4px}
  .ring-pct{font-size:11px;min-width:26px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f6ef7"/>
      <stop offset="100%" stop-color="#7c5cf0"/>
    </linearGradient>
  </defs>
</svg>
<header class="topbar">
  <div class="pill"><span id="connDot" class="dot off"></span><span id="connText">未连接</span></div>
  <div class="pill">↓ <span id="dlSpeed">-</span></div>
  <div class="pill" style="margin-right:auto">↑ <span id="ulSpeed">-</span></div>
  <button class="btn ghost small" id="btnReconnect">刷新</button>
  <button class="btn ghost small" id="btnSettings">设置</button>
</header>

<div class="card">
  <div class="row top">
    <input type="text" id="quickUrl" placeholder="粘贴直链 / 磁力链接（GitHub 链接会自动加速）">
  </div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn ghost" id="btnQuickAdd">添加</button>
    <button class="btn ghost" id="btnClearCompleted">清空已完成任务</button>
  </div>
  <div id="taskMsg" style="flex:none"></div>
  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="col-name">
        <col class="col-size">
        <col class="col-progress">
        <col class="col-speed">
        <col class="col-status">
        <col class="col-ops">
      </colgroup>
      <thead style="position:sticky;top:0;background:#fff;z-index:1">
        <tr><th>名称</th><th>大小</th><th>进度</th><th>速度</th><th class="col-status">状态</th><th>操作</th></tr>
      </thead>
      <tbody id="taskBody"></tbody>
    </table>
  </div>
</div>


<div class="overlay" id="modal">
  <div class="modal">
    <h2>自定义配置</h2>
    <div class="field"><label>默认下载目录</label><input type="text" id="cfgDir" placeholder="例如 /vol1/xxx/Downloads"></div>
    <div class="field"><label>GitHub 加速前缀</label><input type="text" id="cfgPrefix" placeholder="https://gh.llkk.cc/"><div class="hint">例如 https://gh.llkk.cc/ 、https://gh-proxy.com/</div></div>
    <div class="btn-row">
      <button class="btn ghost" id="btnCloseModal">关闭</button>
      <button class="btn" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
'use strict';

const GITHUB_HOST_RE = /^https?:\/\/(github\.com|raw\.githubusercontent\.com|gist\.github\.com|codeload\.github\.com)(\/|$)/i;

let config = { prefix: 'https://gh.llkk.cc/', dir: '' };
let pollTimer = null;

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatBytes(n) {
  n = Number(n);
  if (!n || n <= 0) return '-';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + u[i];
}
function formatSpeed(n) { return formatBytes(n) === '-' ? '-' : formatBytes(n) + '/s'; }
function taskName(t) {
  if (t.bittorrent && t.bittorrent.info && t.bittorrent.info.name) return t.bittorrent.info.name;
  if (t.files && t.files.length) {
    const p = t.files[0].path || '';
    const name = p.split('/').pop() || p.split('\\').pop();
    if (name) return name;
  }
  return t.gid || '';
}
function progressOf(t) {
  if (t.status === 'complete') return 100;
  if (t.totalLength > 0) return Math.min(100, Math.max(0, t.completedLength / t.totalLength * 100));
  return 0;
}
function statusInfo(s) {
  switch (s) {
    case 'active': return { text: '下载', cls: 'active' };
    case 'waiting': return { text: '等待', cls: 'waiting' };
    case 'paused': return { text: '暂停', cls: 'paused' };
    case 'complete': return { text: '完成', cls: 'complete' };
    case 'error': return { text: '错误', cls: 'error' };
    case 'removed': return { text: '已移除', cls: 'removed' };
    default: return { text: s || '-', cls: 'paused' };
  }
}

async function apiGet(endpoint, params) {
  let url = './api/' + endpoint;
  if (params) {
    const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
    if (qs) url += '?' + qs;
  }
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const data = await resp.json();
  if (data && data.error) throw new Error(data.error.message || 'RPC 错误');
  return data;
}

function applyConfigUI() {
  $('cfgPrefix').value = config.prefix;
  $('cfgDir').value = config.dir || '';
  $('cfgDir').placeholder = config.dir || '例如 /vol1/xxx/Downloads';
}

async function loadConfig() {
  try {
    const r = await apiGet('config');
    if (r && r.result) {
      config.prefix = r.result.prefix || 'https://github.dpik.top/';
      config.dir = r.result.dir || '';
    }
  } catch (e) {}
  applyConfigUI();
}

async function saveConfig() {
  const prefix = $('cfgPrefix').value.trim() || 'https://gh.llkk.cc/';
  const dir = $('cfgDir').value.trim();
  try {
    await apiGet('config/save', { prefix: prefix, dir: dir });
  } catch (e) {
    showResult('保存失败：' + e.message, 'err');
    return;
  }
  config.prefix = prefix;
  config.dir = dir;
  applyConfigUI();
  closeModal();
}

function setConn(on, text) {
  $('connDot').className = 'dot ' + (on ? 'on' : 'off');
  $('connText').textContent = text;
}

async function refresh() {
  if (document.hidden) return;
  const sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed) return;
  try {
    const [active, waiting, stopped, stat] = await Promise.all([
      apiGet('active'), apiGet('waiting'), apiGet('stopped'), apiGet('stat')
    ]);
    setConn(true, '已连接');
    renderTasks(active.result || [], waiting.result || [], stopped.result || []);
    renderStat(stat.result || {});
    const hasActive = (active.result || []).length > 0;
    if (hasActive && !pollTimer && !document.hidden) {
      pollTimer = setInterval(refresh, 2500);
    } else if (!hasActive && pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  } catch (e) {
    setConn(false, '未连接');
  }
}

function renderStat(stat) {
  $('dlSpeed').textContent = formatSpeed(stat.downloadSpeed);
  $('ulSpeed').textContent = formatSpeed(stat.uploadSpeed);
}

function renderTasks(active, waiting, stopped) {
  const body = $('taskBody');
  const all = (active || []).concat(waiting || [], stopped || []).filter(t => t && t.status !== 'removed');

  if (!all.length) {
    body.innerHTML = '';
    return;
  }
  body.innerHTML = all.map(t => {
    const st = statusInfo(t.status);
    const pct = progressOf(t);
    let ops = '';
    if (t.status === 'active' || t.status === 'waiting') {
      ops += '<button class="btn small ghost" data-act="pause" data-gid="' + esc(t.gid) + '">暂停</button>';
      ops += '<button class="btn small danger" data-act="forceRemove" data-gid="' + esc(t.gid) + '">删除</button>';
    } else if (t.status === 'paused') {
      ops += '<button class="btn small warn" data-act="unpause" data-gid="' + esc(t.gid) + '">继续</button>';
      ops += '<button class="btn small danger" data-act="forceRemove" data-gid="' + esc(t.gid) + '">删除</button>';
    } else if (t.status === 'complete') {
      const uri = t.files && t.files[0] && t.files[0].uris && t.files[0].uris[0] && t.files[0].uris[0].uri;
      if (uri) ops += '<button class="btn small ghost" data-act="copy" data-url="' + esc(stripAcceleratedPrefix(uri)) + '">复制</button>';
      ops += '<button class="btn small danger" data-act="remove" data-gid="' + esc(t.gid) + '">删除</button>';
    } else {
      ops += '<button class="btn small danger" data-act="remove" data-gid="' + esc(t.gid) + '">移除</button>';
    }
    const circ = 2 * Math.PI * 16; // r=16
    const dash = circ * (1 - pct / 100);
    return '<tr>' +
      '<td class="name" title="' + esc(taskName(t)) + '">' + esc(taskName(t)) + '</td>' +
      '<td>' + formatBytes(t.totalLength) + '</td>' +
      '<td><div class="ring"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="16"/><circle class="ring-fg" cx="18" cy="18" r="16" stroke-dasharray="' + circ.toFixed(2) + '" stroke-dashoffset="' + dash.toFixed(2) + '"/></svg><span class="ring-pct">' + pct.toFixed(0) + '%</span></div></td>' +
      '<td>' + formatSpeed(t.downloadSpeed) + '</td>' +
      '<td class="col-status"><span class="tag ' + st.cls + '">' + st.text + '</span></td>' +
      '<td><div class="actions">' + ops + '</div></td>' +
      '</tr>';
  }).join('');
}

async function taskAction(act, gid) {
  const ep = { pause: 'pause', unpause: 'unpause', remove: 'remove', forceRemove: 'forceRemove' }[act];
  if (!ep) return;
  try {
    await apiGet(ep, { gid });
  } catch (e) {
    showTaskMsg('操作失败：' + e.message, 'err');
  }
  setTimeout(refresh, 400);
}

function transformUrl(raw) {
  const u = String(raw || '').trim();
  if (!u) return null;
  if (GITHUB_HOST_RE.test(u)) {
    const p = String(config.prefix || '').trim().replace(/\/+$/, '');
    return p ? p + '/' + u : u;
  }
  return u;
}
function isAddable(u) { return /^(https?:\/\/|magnet:)/i.test(u); }

async function addUrls(lines) {
  const urls = [];
  for (const line of lines) {
    const u = String(line || '').trim();
    if (!u) continue;
    if (!isAddable(u)) continue;
    const target = transformUrl(u);
    if (target) urls.push(target);
  }
  if (!urls.length) { showResult('没有可添加的有效链接（支持 http/https 直链与 magnet 磁力链接）。', 'err'); return; }

  for (const u of urls) {
    const params = { url: u };
    if (config.dir) params.dir = config.dir;
    try {
      await apiGet('add', params);
    } catch (e) {
      showResult('添加失败：' + u + '（' + e.message + '）', 'err');
    }
  }
  setTimeout(refresh, 500);
}

// 从加速后的 URI 还原原始地址
function stripAcceleratedPrefix(u) {
  const p = String(config.prefix || '').trim().replace(/\/+$/, '');
  if (p && u.startsWith(p + '/')) return u.slice(p.length + 1);
  return u;
}

// 复制文本（HTTP 环境降级到 execCommand）
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy') ? resolve() : reject(new Error('copy failed'));
    } catch (e) {
      reject(e);
    }
    document.body.removeChild(ta);
  });
}

function showResult(text, type) {
  showTaskMsg(text, type);
}

function showTaskMsg(text, type) {
  const el = $('taskMsg');
  if (!text) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="msg ' + (type || 'info') + '">' + esc(text) + '</div>';
}

async function clearCompletedTasks() {
  try {
    const stopped = await apiGet('stopped');
    const gids = (stopped.result || []).filter(t =>
      t.status === 'complete' || t.status === 'error' || t.status === 'removed'
    ).map(t => t.gid);
    if (!gids.length) {
      showTaskMsg('没有可清空的已完成任务', 'info');
      return;
    }
    for (const gid of gids) {
      try { await apiGet('remove', { gid }); } catch (e) {}
    }
  } catch (e) {
    showTaskMsg('清空失败：' + e.message, 'err');
  }
  setTimeout(refresh, 400);
}

function openModal() {
  $('cfgPrefix').value = config.prefix;
  $('cfgDir').value = config.dir || '';
  $('modal').classList.add('show');
}
function closeModal() { $('modal').classList.remove('show'); }

// 事件绑定
$('btnReconnect').addEventListener('click', refresh);
$('btnSettings').addEventListener('click', openModal);
$('btnCloseModal').addEventListener('click', closeModal);
$('btnSave').addEventListener('click', saveConfig);
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });

$('btnQuickAdd').addEventListener('click', () => {
  addUrls([$('quickUrl').value]).then(() => { $('quickUrl').value = ''; });
});
$('btnClearCompleted').addEventListener('click', clearCompletedTasks);

$('taskBody').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  if (btn.dataset.act === 'copy') {
    copyText(btn.dataset.url).catch(() => {});
    return;
  }
  taskAction(btn.dataset.act, btn.dataset.gid);
});

// 初始化
applyConfigUI();
loadConfig();
refresh();
document.addEventListener('visibilitychange', () => {
  if (document.hidden && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  else if (!document.hidden) refresh();
});
window.addEventListener('beforeunload', () => { if (pollTimer) clearInterval(pollTimer); });
</script>
</body>
</html>
